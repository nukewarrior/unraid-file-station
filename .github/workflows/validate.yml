name: 检查用户脚本

on:
  push:
    branches: ["master", "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 校验脚本语法
        run: node --check src/unraid-file-station.user.js
      - name: 执行单元测试
        run: node --test tests/*.test.mjs
